[project]
name = "benchmarks"
version = "0.1.0"
description = "Benchmarks"
authors = [{ name = "Tomoki Fujihara", email = "tomoki.fujihara@abejainc.com"}]

readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "datasets>=4.5.0",
    "html2text>=2025.4.15",
    "nltk>=3.9.2",
    "pydantic>=2.12.5",
    "requests>=2.32.5",
    "tqdm>=4.67.1",
    "wandb>=0.24.0",
    "wonderwords>=3.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
