services:
  vllm:
    container_name: longcontext-evaluation-vllm
    image: longcontext-evaluation-vllm-openai:${TAG:-latest}
    build:
        context: ../..
        dockerfile: containers/docker/Dockerfile
        args:
          BASE_IMAGE: vllm/vllm-openai:v0.13.0
    working_dir: /workspace
    volumes:
      - ../..:/workspace
      - ../../.cache:/.cache
    deploy:
          resources:
            reservations:
              devices:
                - driver: nvidia
                  count: all
                  capabilities: [ gpu ]
    environment:
      - HF_HUB_ENABLE_HF_TRANSFER=1
      - HF_HOME=/.cache/huggingface
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=utility,compute