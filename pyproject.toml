[project]
name = "longcontext-evaluation"
version = "0.1.0"
description = "Evaluation framework for long-context language models"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pyright>=1.1.408",
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.13",
    "benchmarks",
    "llm_inference",
    "python-dotenv>=1.2.1",
    "numpy<2.3.0",
    "huggingface-hub<1.0",
]

[tool.uv.workspace]
members = [
  "packages/benchmarks",
  "packages/llm_inference",
]

[tool.uv.sources]
benchmarks    = { workspace = true }
llm_inference = { workspace = true }
