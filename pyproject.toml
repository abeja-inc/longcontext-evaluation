[project]
name = "longcontext-evaluation"
version = "0.1.0"
description = "Evaluation framework for long-context language models"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pyright>=1.1.408",
    "ruff>=0.14.13",
    "benchmarks",
    "llm_inference",
]

[tool.uv.workspace]
members = [
  "packages/benchmarks",
  "packages/llm_inference",
]

[tool.uv.sources]
benchmarks    = { workspace = true }
llm_inference = { workspace = true }
