name: Ruff & Pyright Check

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    ruff-check:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.11"]

        steps:
            - name: Install build tools
              run: |
                sudo apt-get update
                sudo apt-get install -y build-essential

            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v3

            - name: Install dependencies
              run: |
                uv python install ${{ matrix.python-version }}
                uv sync --python ${{ matrix.python-version }}

            - name: Run ruff-check
              run: |
                  make ruff-check .
    
    pyright-check:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.11"]
    
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
    
            - name: Build image (compose)
              run: |
                  docker compose -f containers/docker/docker-compose.yaml build vllm
    
            - name: Run pyright in container
              run: |
                docker compose -f containers/docker/docker-compose.yaml run --rm \
                  --entrypoint /bin/bash vllm -lc \
                  "uv sync --python ${{ matrix.python-version }} && make pyright-check . PYRIGHT_PYTHON_VERSION=${{ matrix.python-version }}"