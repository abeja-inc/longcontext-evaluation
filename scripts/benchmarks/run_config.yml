model:
  root: ~/models
  name: example-model

generator:
  type: vllm_offline
  vllm_config: ./vllm_offline_config.yml
  # For OpenAI API:
  # type: openai
  # api_key: ${OPENAI_API_KEY}
  # base_url: null
  # model_name: gpt-4o-2024-11-20
  # max_context_length: 8192
  # max_output_tokens: 256
  # buffer_tokens: 10
  # chat_kwargs: {}
  # completion_kwargs: {}
  # For vLLM OpenAI-compatible server:
  # type: vllm_openai_compatible
  # api_key: ${API_KEY}
  # base_url: ${BASE_URL}
  # model_name: qwen3
  # model_path: ~/models/qwen3
  # max_context_length: 8192
  # max_output_tokens: 256
  # buffer_tokens: 10
  # chat_kwargs: {}
  # completion_kwargs: {}
output_dir: ~/longcontext-llm-benchmark-eval/experimentation/outputs
dataset_dir: ~/datasets
batchsize: 1

benchmarks:
  longbench_v2:
    enabled: true
    tasks_path: ./LongBench_v2/evaluation/tasks.yml
    run_pred: true
    run_eval: true
    rag_topn: 0
    cot: false
    no_context: false
    only_datasets: null
    exclude_datasets: null
    compensate_missing: false
    wandb: {}

  mrcr:
    enabled: true
    tasks_path: ./OpenAI_MRCR/evaluation/tasks.yml
    eval_config: ./OpenAI_MRCR/evaluation/eval_config.yml
    run_pred: true
    run_eval: true
    only_tasks: null
    exclude_tasks: null
    only_subsets: null
    exclude_subsets: null
    wandb: {}

  ruler:
    enabled: true
    tasks_path: ./RULER/evaluation/tasks.yml
    eval_config: ./RULER/evaluation/eval_config.yml
    run_pred: true
    run_eval: true
    only_tasks: null
    exclude_tasks: null
    only_subsets: null
    exclude_subsets: null
    wandb: {}
