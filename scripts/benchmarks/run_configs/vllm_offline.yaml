base_config: scripts/benchmarks/run_configs/base.yaml

run_name: Qwen3-0.6B-enable-thinking/trial_1
llm:
    generator:
        type: vllm_offline_inference
        model_name: /workspace/models/Qwen3-0.6B
        max_context_length: 131072
        max_output_tokens: 8192
        dtype: float32
        tensor_parallel_size: 8
        trust_remote_code: true
        max_num_seqs: 256
        hf_overrides:
            rope_parameters:
                rope_type: yarn
                factor: 4.0
                original_max_position_embeddings: 32768
        reasoning_parser: qwen3

    generation_kwargs:
        sampling_params:
            n: 1
            temperature: 0.7
            top_p: 0.8
            top_k: 20
            min_p: 0.0
        chat_template_kwargs:
            enable_thinking: true
