output_root: outputs/benchmarks
dataset_root: datasets/benchmarks
batchsize: 1

run_name: null
llm: null

wandb:
    null
    # entity: xxx
    # project: longcontext_evaluation_benchmark

benchmarks:
    # Add your benchmark configurations here
    context_poisoning_resistance:
        make_ten_jpn:
            clean_k1:
                language: japanese
                dataset_filename: japanese/k1/clean.jsonl
                inference_mode: chat
                metric: equation_validity_accuracy
                settings: &context_poisoning_settings
                    use_truncate: false
                    prompt:
                        dirpath: scripts/benchmarks/Context_Poisoning_Resistance/prompts
                        files:
                            system_prompt: system_prompt.txt
                            question: question.txt
                            question_prefix: question_prefix.txt
            poisoned_k1:
                language: japanese
                dataset_filename: japanese/k1/poisoned.jsonl
                inference_mode: chat
                metric: equation_validity_accuracy
                settings: *context_poisoning_settings
