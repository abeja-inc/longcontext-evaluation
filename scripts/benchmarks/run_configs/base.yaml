# Common benchmark run defaults.
# Other run configs inherit this file via `base_config` and override only LLM-specific fields.
output_root: outputs/benchmarks # Directory where benchmark outputs/metrics are saved.
dataset_root: datasets/benchmarks # Root directory that contains benchmark datasets.
batchsize: 128 # Number of prompts processed per batch.

run_name: null # Optional run name. Child configs usually override this.
llm: null # Placeholder. Child configs must define generator/generation settings.

wandb:
    null # Set to null to disable Weights & Biases logging.
    # entity: xxx
    # project: longcontext_evaluation_benchmark

benchmarks:
    # Benchmark suite definitions. Structure: <suite> -> <dataset_group> -> <task_variant>.
    longbench_v2:
        longbench_v2_eng:
            all:
                language: english # Prompt language used for the dataset.
                dataset_filename: english/longbench_v2_with_token_count.jsonl # Dataset file under `dataset_root/longbench_v2`.
                inference_mode: chat # Inference interface type.
                metric: parsed_answer_match # Evaluation metric for this task.
                settings:
                    require_reasoning: false # Whether to enforce reasoning-style output.
                    use_truncate: true # Truncate over-length inputs to fit context length.
                    rag_topn: 0 # Number of retrieved chunks for RAG prompt.
                    cot: false # Use chain-of-thought prompt variant.
                    no_context: false # Run without context passages.
                    compensate_missing: false # Compensate if dataset context is missing.
                    prompt:
                        dirpath: scripts/benchmarks/LongBench_v2/prompts # Prompt template directory.
                        files:
                            zero_shot: 0shot.txt
                            zero_shot_cot: 0shot_cot.txt
                            zero_shot_cot_ans: 0shot_cot_ans.txt
                            zero_shot_no_context: 0shot_no_context.txt
                            zero_shot_rag: 0shot_rag.txt

    openai_mrcr:
        mrcr_eng:
            2needle:
                language: english
                dataset_filename: english/2needle/mrcr_with_token_count.jsonl
                inference_mode: chat
                metric: prefix_match_similarity # Compare prefix similarity against expected answer.
                settings:
                    require_reasoning: false
                    use_truncate: true
            4needle:
                language: english
                dataset_filename: english/4needle/mrcr_with_token_count.jsonl
                inference_mode: chat
                metric: prefix_match_similarity
                settings:
                    require_reasoning: false
                    use_truncate: true
            8needle:
                language: english
                dataset_filename: english/8needle/mrcr_with_token_count.jsonl
                inference_mode: chat
                metric: prefix_match_similarity
                settings:
                    require_reasoning: false
                    use_truncate: true
        mrcr_jpn:
            2needle:
                language: japanese
                dataset_filename: japanese/2needle/mrcr_japanese_with_token_count.jsonl
                inference_mode: chat
                metric: prefix_match_similarity
                settings:
                    require_reasoning: false
                    use_truncate: true
            4needle:
                language: japanese
                dataset_filename: japanese/4needle/mrcr_japanese_with_token_count.jsonl
                inference_mode: chat
                metric: prefix_match_similarity
                settings:
                    require_reasoning: false
                    use_truncate: true
            8needle:
                language: japanese
                dataset_filename: japanese/8needle/mrcr_japanese_with_token_count.jsonl
                inference_mode: chat
                metric: prefix_match_similarity
                settings:
                    require_reasoning: false
                    use_truncate: true

    ruler:
        niah:
            niah_single_2:
                language: english
                dataset_filename: niah/niah_single_2.jsonl
                inference_mode: chat
                metric: substr_coverage # or lcs_f1_coverage
                settings:
                    require_reasoning: false
                    use_truncate: true
            niah_multikey_1:
                language: english
                dataset_filename: niah/niah_multikey_1.jsonl
                inference_mode: chat
                metric: substr_coverage # or lcs_f1_coverage
                settings:
                    require_reasoning: false
                    use_truncate: true
            niah_multikey_2:
                language: english
                dataset_filename: niah/niah_multikey_2.jsonl
                inference_mode: chat
                metric: substr_coverage # or lcs_f1_coverage
                settings:
                    require_reasoning: false
                    use_truncate: true
            niah_multikey_3:
                language: english
                dataset_filename: niah/niah_multikey_3.jsonl
                inference_mode: chat
                metric: substr_coverage # or lcs_f1_coverage
                settings:
                    require_reasoning: false
                    use_truncate: true
        qa:
            squad:
                language: english
                dataset_filename: qa/squad.jsonl
                inference_mode: chat
                metric: substr_any # or lcs_f1_max
                settings:
                    require_reasoning: false
                    use_truncate: true
            hotpotqa:
                language: english
                dataset_filename: qa/hotpotqa.jsonl
                inference_mode: chat
                metric: substr_any # or lcs_f1_max
                settings:
                    require_reasoning: false
                    use_truncate: true
            jsquad:
                language: japanese
                dataset_filename: qa/jsquad.jsonl
                inference_mode: chat
                metric: substr_any # or lcs_f1_max
                settings:
                    require_reasoning: false
