base_config: ./base.yml

model:
  root: ~/models
  name: unused

generator:
  type: vllm_openai_compatible
  api_key: ${API_KEY}
  base_url: ${BASE_URL}
  model_name: qwen3
  model_path: ~/models/qwen3
  max_context_length: 8192
  max_output_tokens: 256
  buffer_tokens: 10
  chat_kwargs: {}
  completion_kwargs: {}
